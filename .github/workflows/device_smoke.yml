name: device-smoke
# Installe l'APK release sur un émulateur Android, le lance, et récupère
# logcat + captures d'écran (diagnostic des plantages au démarrage).
on:
  push:
    branches: [main]
    paths: ['.github/workflows/device_smoke.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Projet Android
        run: |
          mkdir -p out
          [ -d android ] || flutter create --platforms=android --project-name boom_party --org com.boomparty . > /dev/null
          python3 tools/patch_android.py .
          cp android/app/src/main/AndroidManifest.xml out/AndroidManifest.xml
          cp android/app/build.gradle* out/ 2>/dev/null || true
      - name: APK release x86_64 (même configuration que le téléphone)
        run: |
          flutter pub get > /dev/null
          flutter build apk --release --split-per-abi --target-platform android-x64 2>&1 | tail -15 | tee out/build.txt
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Lancer sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/smoke_on_device.sh out
      - name: Publier sur la branche smoke-results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          echo "${GITHUB_SHA}" > SOURCE_COMMIT.txt
          git init -q && git checkout -q -b smoke-results
          git config user.name "boom-ci" && git config user.email "ci@boomparty.local"
          git add -A && git commit -qm "Smoke test ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" smoke-results
