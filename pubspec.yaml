name: boom_party
description: BOOM PARTY — jeu de soirée cartoon (Flutter + Flame).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  shared_preferences: ^2.2.0
  speech_to_text: ^7.0.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
    - assets/illustrations/
  fonts:
    - family: Lilita
      fonts:
        - asset: assets/fonts/LilitaOne_400Regular.ttf
