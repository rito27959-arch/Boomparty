name: boom_party
description: BOOM PARTY — jeu de soirée cartoon (Flutter + Flame).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  shared_preferences: ^2.2.0
  speech_to_text: ^7.0.0
  share_plus: ^10.1.4
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  record: ^7.0.0
  sherpa_onnx: ^1.12.40
  archive: ^3.6.1
  crypto: ^3.0.3
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
    - assets/illustrations/
    - assets/knowledge/
    - assets/voice/
    - assets/voice/classique/classic/
    - assets/voice/classique/crazy/
    - assets/voice/classique/drama/
    - assets/voice/drole/classic/
    - assets/voice/drole/crazy/
    - assets/voice/drole/drama/
    - assets/voice/serieuse/classic/
    - assets/voice/serieuse/crazy/
    - assets/voice/serieuse/drama/
    - assets/voice/robot/classic/
    - assets/voice/robot/crazy/
    - assets/voice/robot/drama/
  fonts:
    - family: Lilita
      fonts:
        - asset: assets/fonts/LilitaOne_400Regular.ttf
